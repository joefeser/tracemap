name: Adapter Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: adapter-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Full-suite semantic scans honor the SQL corpus's global.json.
          # Keep the current SDK too; installing only latest cannot resolve
          # the deliberately non-roll-forward fixture compiler baseline.
          dotnet-version: |
            10.0.x
            10.0.302
      - name: Verify pinned SQL fixture SDK resolves
        working-directory: samples/sql-database-matrix
        run: dotnet --version
      # Change-impact v1: pull requests confined to leaf areas run a reduced lane that
      # excludes the self-contained campaign families (WebFormsReview*, SqlDatabaseMatrix*,
      # OutboundHttp*); shared-core changes, pushes to dev/main, dispatches, missing change
      # data and large change sets all run the full suite. The trigger table lives in
      # scripts/select_dotnet_test_lane.py and a reduced run is labelled partial in the step
      # name and the job summary. A reduced pass is a partial result: the dev/main push runs
      # everything, so a regression in an excluded family surfaces there, before promotion.
      - name: Collect pull-request changed paths
        if: github.event_name == 'pull_request'
        env:
          # Only this step sees the token; the selector and its tests run without it.
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Renames contribute both names. A failed or partial lookup leaves no paths at
          # all, which the selector resolves to the full suite.
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" \
              --jq '.files[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-paths.txt"; then
            : > "$RUNNER_TEMP/changed-paths.txt"
            echo "::warning::changed-path lookup failed; the full suite will run"
          fi
      - name: Select test lane from changed paths
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/test_select_dotnet_test_lane.py
          touch "$RUNNER_TEMP/changed-paths.txt"
          python3 scripts/select_dotnet_test_lane.py --event "$EVENT_NAME" --github-output "$GITHUB_OUTPUT" \
            < "$RUNNER_TEMP/changed-paths.txt" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build and test (${{ steps.lane.outputs.lane }} lane)
        env:
          LANE_FILTER: ${{ steps.lane.outputs.filter }}
        run: |
          dotnet build src/dotnet/TraceMap.sln
          if [ -n "$LANE_FILTER" ]; then
            echo "partial run: --filter \"$LANE_FILTER\""
            dotnet test src/dotnet/TraceMap.sln --no-build --filter "$LANE_FILTER"
          else
            dotnet test src/dotnet/TraceMap.sln --no-build
          fi
      - name: Generate and validate artifacts
        run: |
          dotnet run --project src/dotnet/TraceMap.Cli --no-build -- scan \
            --repo samples/modern-sample \
            --out "$RUNNER_TEMP/tracemap-dotnet"
          python3 scripts/validate-adapter-artifacts.py "$RUNNER_TEMP/tracemap-dotnet"
          python3 scripts/test_validate_adapter_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-index-dotnet
          path: ${{ runner.temp }}/tracemap-dotnet/index.sqlite
          if-no-files-found: error

  typescript:
    name: TypeScript adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/typescript/package-lock.json
      - name: Build and test
        working-directory: src/typescript
        run: |
          npm ci
          npm run check
      - name: Generate and validate artifacts
        run: |
          node src/typescript/dist/src/cli.js scan \
            --repo samples/typescript-modern-sample \
            --out "$RUNNER_TEMP/tracemap-typescript"
          python3 scripts/validate-adapter-artifacts.py "$RUNNER_TEMP/tracemap-typescript"
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-index-typescript
          path: ${{ runner.temp }}/tracemap-typescript/index.sqlite
          if-no-files-found: error

  python:
    name: Python adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/python/pyproject.toml
      - name: Install and test
        run: |
          python -m pip install -e "src/python[dev]"
          python -m pytest src/python/tests
      - name: Generate and validate artifacts
        run: |
          tracemap-py scan \
            --repo samples/python-fastapi-sample \
            --out "$RUNNER_TEMP/tracemap-python"
          python scripts/validate-adapter-artifacts.py "$RUNNER_TEMP/tracemap-python"
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-index-python
          path: ${{ runner.temp }}/tracemap-python/index.sqlite
          if-no-files-found: error

  jvm:
    name: JVM adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Build and test
        run: gradle -p src/jvm test installDist
      - name: Generate and validate artifacts
        run: |
          src/jvm/build/install/tracemap-jvm/bin/tracemap-jvm scan \
            --repo samples/jvm-modern-sample \
            --out "$RUNNER_TEMP/tracemap-jvm"
          python3 scripts/validate-adapter-artifacts.py "$RUNNER_TEMP/tracemap-jvm"
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-index-jvm
          path: ${{ runner.temp }}/tracemap-jvm/index.sqlite
          if-no-files-found: error

  swift:
    name: Swift adapter
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          swift build --package-path src/swift
          swift test --package-path src/swift
          swift run --package-path src/swift tracemap-swift-smoke-tests
      - name: Generate and validate artifacts
        run: |
          swift run --package-path src/swift tracemap-swift scan \
            --repo samples/swift-package-basic \
            --out "$RUNNER_TEMP/tracemap-swift"
          python3 scripts/validate-adapter-artifacts.py "$RUNNER_TEMP/tracemap-swift"
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-index-swift
          path: ${{ runner.temp }}/tracemap-swift/index.sqlite
          if-no-files-found: error

  combined-conformance:
    name: Five-adapter combine
    needs:
      - dotnet
      - typescript
      - python
      - jvm
      - swift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: adapter-index-*
          path: adapter-indexes
      - name: Combine every adapter family
        run: |
          dotnet run --project src/dotnet/TraceMap.Cli -- combine \
            --index adapter-indexes/adapter-index-dotnet/index.sqlite --label dotnet \
            --index adapter-indexes/adapter-index-typescript/index.sqlite --label typescript \
            --index adapter-indexes/adapter-index-python/index.sqlite --label python \
            --index adapter-indexes/adapter-index-jvm/index.sqlite --label jvm \
            --index adapter-indexes/adapter-index-swift/index.sqlite --label swift \
            --out "$RUNNER_TEMP/combined.sqlite"
          dotnet run --project src/dotnet/TraceMap.Cli -- report \
            --index "$RUNNER_TEMP/combined.sqlite" \
            --out "$RUNNER_TEMP/combined-report"
          test -f "$RUNNER_TEMP/combined-report/dependency-report.json"
