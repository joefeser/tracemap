name: HTTP report provenance
on:
  pull_request:
    paths: ['scripts/verify-http-report-provenance.py', 'scripts/validation/test_http_report_provenance.py', 'src/dotnet/**', '.github/workflows/http-report-provenance.yml']
  push:
    branches: [dev, main]
    paths: ['scripts/verify-http-report-provenance.py', 'scripts/validation/test_http_report_provenance.py', 'src/dotnet/**', '.github/workflows/http-report-provenance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Synthetic byte-identity and rejection matrix
        run: python scripts/validation/test_http_report_provenance.py
      - name: Native CLI receipt and grouped handoff interoperability
        env:
          TRACEMAP_PROVENANCE_PYTHON: python
        run: dotnet test src/dotnet/tests/TraceMap.Tests/TraceMap.Tests.csproj -c Debug -warnaserror --filter FullyQualifiedName~HttpReportProvenanceInteropTests
