name: DNN SQL harness static guards
on:
  pull_request:
    paths: ['scripts/sqlserver-*-evidence/**', 'samples/sqlserver-*-evidence/**', 'scripts/dnn-sql-validation/**', 'scripts/validation/test_dnn_sql_harness.py', 'scripts/validation/test_sql_public_acceptance.py', 'samples/dnn-sql-validation/**', '.gitattributes', '.github/workflows/dnn-sql-harness-guards.yml']
  push:
    branches: [dev, main]
    paths: ['scripts/sqlserver-*-evidence/**', 'samples/sqlserver-*-evidence/**', 'scripts/dnn-sql-validation/**', 'scripts/validation/test_dnn_sql_harness.py', 'scripts/validation/test_sql_public_acceptance.py', 'samples/dnn-sql-validation/**', '.gitattributes', '.github/workflows/dnn-sql-harness-guards.yml']
permissions:
  contents: read
jobs:
  offline-guards:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline defaults, provenance, activation guards and mocked cleanup
        run: python -m unittest discover -s scripts/validation -p test_dnn_sql_harness.py -v
      - name: Public acceptance packet guards (no fetch, build or SQL)
        run: python -m unittest discover -s scripts/validation -p test_sql_public_acceptance.py -v
