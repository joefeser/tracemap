name: Retained gap inventory
on:
  push:
    paths: ['scripts/summarize-retained-gaps.py', 'scripts/validation/test_retained_gap_inventory.py', '.github/workflows/retained-gap-inventory.yml']
  pull_request:
    paths: ['scripts/summarize-retained-gaps.py', 'scripts/validation/test_retained_gap_inventory.py', '.github/workflows/retained-gap-inventory.yml']
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validation/test_retained_gap_inventory.py
